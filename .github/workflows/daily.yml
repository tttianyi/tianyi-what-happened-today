# 每日定时运行：抓取 → 打分 → 总结 → 推送到 Telegram
# Daily run: ingest → triage → summarize → deliver to Telegram
name: Daily digest

on:
  # 主触发：cron-job.org 每天按都柏林时间准时调用 GitHub API（workflow_dispatch），并传 skip_if_sent_today=true。
  # GitHub 自带的定时任务不可靠（实测：两天只触发一次，还晚了 9 小时），所以只作为备用。
  # Main trigger: cron-job.org calls the GitHub API (workflow_dispatch) on time every day, Dublin time,
  # passing skip_if_sent_today=true. GitHub's own schedule proved unreliable (once in two days, 9 hours late),
  # so it's only a backup.
  workflow_dispatch:
    inputs:
      skip_if_sent_today:
        description: "Skip if today's digest was already sent / 今天已发送过就跳过"
        type: boolean
        default: false # 网页上手动运行默认总是执行，方便测试和补发 / manual runs always go ahead by default

  # 备用：cron 用 UTC 时间。如果今天已经成功发送过，check 会让这次直接跳过，不重复推送、不花 token。
  # Backup (cron is UTC). If today's digest was already sent, `check` skips the run: no duplicate, no tokens.
  schedule:
    - cron: "0 8 * * *"
    - cron: "0 10 * * *"

# 同一时间只跑一个，避免重复推送 / Only one run at a time, so the digest is never sent twice
concurrency:
  group: daily-digest
  cancel-in-progress: false

# 最小权限：读代码 + 读运行记录（用来判断今天是否已发送）
# Least privilege: read the code + read run history (to see if today's digest was already sent)
permissions:
  contents: read
  actions: read

jobs:
  # 今天是否已经成功发送过？对备用定时任务和 cron-job.org 的触发做检查；网页手动运行默认不检查。
  # Already sent today? Checked for backup schedules and cron-job.org triggers; manual runs skip the check by default.
  check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.today.outputs.skip }}
    steps:
      - id: today
        # API 触发时参数可能是字符串 "true"，所以两种都认 / via the API the input may arrive as the string "true"
        if: github.event_name == 'schedule' || inputs.skip_if_sent_today == true || inputs.skip_if_sent_today == 'true'
        env:
          GH_TOKEN: ${{ github.token }} # GitHub 自动提供的临时 token，不需要额外 Secret / built-in temporary token, no extra Secret
        run: |
          today=$(date -u +%F)
          sent=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow daily.yml --status success \
            --created ">=$today" --json databaseId --jq length)
          echo "Successful runs today / 今天已成功运行: $sent"
          if [ "$sent" -gt 0 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi

  digest:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    # 正常约 5 分钟（主要是免费版限流等待）；卡住就停，不浪费额度
    # Normally ~5 minutes (mostly free-tier rate-limit waits); stop if it hangs
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24 # 和本地一致，需要 process.loadEnvFile 等新 API / same as local
          cache: npm

      # npm ci：严格按 package-lock.json 安装，每次结果一样 / installs exactly what package-lock.json says
      - run: npm ci

      # 先做类型检查，代码有错就不调用 LLM / Type-check first: broken code never reaches the LLM
      - run: npm run typecheck

      - run: npm run pipeline
        env:
          # key 来自仓库的 Secrets，不在代码里；日志里会被自动打码
          # Keys come from repository Secrets, never the code; GitHub masks them in logs
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_NEWS_BOT_TOKEN: ${{ secrets.TELEGRAM_NEWS_BOT_TOKEN }}
          TELEGRAM_NEWS_CHAT_ID: ${{ secrets.TELEGRAM_NEWS_CHAT_ID }}
