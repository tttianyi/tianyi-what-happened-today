# 新闻源配置 / News source configuration
# 用公开 RSS 发现新闻；只有入选日报的文章才抓取正文（见 enrich.ts）
# Public RSS feeds for discovery; full text is fetched only for selected articles (see enrich.ts).
# 加新源只需在这里加一行，不用改代码 / Add a source here; no code change needed.

sources:
  # ---- 爱尔兰综合新闻 / Irish general news ----
  - id: rte
    name: RTÉ News
    url: https://www.rte.ie/feeds/rss/?index=/news/
    category: ireland

  - id: thejournal
    name: TheJournal.ie
    url: https://www.thejournal.ie/feed/
    category: ireland

  - id: irishtimes
    name: The Irish Times
    url: https://www.irishtimes.com/arc/outboundfeeds/feed-irish-news/?outputType=xml
    category: ireland

  - id: independent
    name: Irish Independent
    url: https://www.independent.ie/irish-news/rss
    category: ireland

  # ---- 爱尔兰科技 / Irish tech ----
  - id: siliconrepublic
    name: Silicon Republic
    url: https://www.siliconrepublic.com/feed
    category: ireland-tech

  # ---- 国际科技 / Global tech ----
  - id: hackernews
    name: Hacker News (100+ points)
    url: https://hnrss.org/frontpage?points=100
    category: tech

  - id: techcrunch
    name: TechCrunch
    url: https://techcrunch.com/feed/
    category: tech

  - id: theverge
    name: The Verge
    url: https://www.theverge.com/rss/index.xml
    category: tech

  # ---- 中国（英文国际媒体）/ China (international English-language media) ----
  - id: scmp-china
    name: South China Morning Post
    url: https://www.scmp.com/rss/4/feed
    category: china

  - id: guardian-china
    name: The Guardian (China)
    url: https://www.theguardian.com/world/china/rss
    category: china

  # ---- 电影 / Film ----
  - id: guardian-film
    name: The Guardian (Film)
    url: https://www.theguardian.com/film/rss
    category: film

  - id: variety-film
    name: Variety (Film)
    url: https://variety.com/v/film/feed/
    category: film

  # ---- 设计/美术/艺术 / Design & art ----
  - id: dezeen
    name: Dezeen
    url: https://www.dezeen.com/feed/
    category: design

  - id: colossal
    name: Colossal
    url: https://www.thisiscolossal.com/feed/
    category: design

  - id: guardian-art
    name: The Guardian (Art & Design)
    url: https://www.theguardian.com/artanddesign/rss
    category: design
