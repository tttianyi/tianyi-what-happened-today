# 日报板块配置 / Digest section configuration
# 每个板块从指定的源分类里，按 LLM 打的分数选出前 N 条。
# Each section takes the top-N articles (by LLM importance) from the listed source categories.
#
# rubric（评分标准）：每个板块单独打分，只和同领域的文章比较。
# 这样电影、艺术类文章不用和爱尔兰政治新闻抢分数。
# rubric: each section is scored separately, against articles from the same field only,
# so film or art stories don't compete with Irish politics for points.
#
# 加一个新领域 = 在 sources.yaml 加源 + 在这里加一个板块（含评分标准），不用改代码。
# New area = add sources in sources.yaml + one section here (with its rubric). No code change.

sections:
  - id: ireland
    title_en: Ireland
    title_zh: 爱尔兰
    categories: [ireland]          # 对应 sources.yaml 里的 category / matches `category` in sources.yaml
    count: 3
    rubric: |
      5 = major national news in Ireland: government decisions, the budget, major court rulings, events affecting many people
      4 = a significant Irish story worth reading today
      3 = moderately interesting
      2 = local or niche
      1 = trivial, routine, or promotional

  - id: tech
    title_en: Tech
    title_zh: 科技
    categories: [tech, ireland-tech] # Silicon Republic（爱尔兰科技）放在科技板块 / Silicon Republic goes under Tech
    count: 4
    rubric: |
      5 = a major global development in technology or AI: important launches, regulation, major deals, security incidents with wide impact
      4 = a significant tech story worth reading today
      3 = moderately interesting
      2 = a niche or minor product update
      1 = trivial, deals and discounts, or promotional

  - id: china
    title_en: China
    title_zh: 中国
    categories: [china]
    count: 1
    rubric: |
      5 = a major development in China's politics, economy, foreign relations or society with wide impact
      4 = a significant China story worth reading today
      3 = moderately interesting
      2 = regional, minor, or niche
      1 = trivial or routine

  - id: film
    title_en: Film
    title_zh: 电影
    categories: [film]
    count: 1
    rubric: |
      5 = major film news: an important release, a major festival or award, a significant industry deal, or the death of a major figure
      4 = a notable film, review or industry story worth reading today
      3 = moderately interesting
      2 = minor or niche
      1 = gossip, box-office trivia, or promotional

  - id: design
    title_en: Design & Art
    title_zh: 设计与艺术
    categories: [design]
    count: 1
    rubric: |
      5 = major news in design, architecture or art: a landmark building, a major exhibition, a significant award, an influential project
      4 = a notable project, artist or exhibition worth reading today
      3 = moderately interesting
      2 = minor or niche
      1 = product promotion, sales, or routine announcements
